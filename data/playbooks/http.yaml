---
- hosts: all
  gather_facts: false
  vars:
    domain_name: "{{ compose_project }}.{{ domain_root }}"
  tasks:
    - name: Build base service definition
      ansible.builtin.set_fact:
        _web_service:
          image: "{{ image }}"
          environment: >-
            {{
              {
                'ANSIBLE_DEPLOY_DOMAIN_NAME': domain_name
              }
              | combine(env | default({}))
            }}
          labels:
            - "traefik.enable=true"
            - "traefik.http.routers.site_{{ compose_project }}.rule=Host(`{{ domain_name }}`)"
            - "traefik.http.services.site_{{ compose_project }}.loadbalancer.server.port={{ http_port | default(80) }}"
          networks:
            - "{{ traefik_network }}"
          restart: unless-stopped
      tags:
        - create
        - delete

    - name: Apply resource limits to service
      ansible.builtin.set_fact:
        _web_service: "{{ _web_service | combine(resource_overrides, recursive=True) }}"
      when: resource_overrides is defined and resource_overrides | length > 0
      tags:
        - create
        - delete

    - name: Build compose definition
      ansible.builtin.set_fact:
        _compose_def:
          services:
            web: "{{ _web_service }}"
          networks: "{{ {traefik_network: {'external': true}} }}"
      tags:
        - create
        - delete

    - name: Déploiement du docker-compose
      community.docker.docker_compose_v2:
        definition: "{{ _compose_def }}"
        project_name: "{{ compose_project }}"
        pull: missing
      tags: create

    - name: Arrêt des conteneurs
      ansible.builtin.command: "docker compose -p {{ compose_project }} kill"
      failed_when: false
      tags: delete

    - name: Arrêt et suppression du docker-compose
      community.docker.docker_compose_v2:
        definition: "{{ _compose_def }}"
        project_name: "{{ compose_project }}"
        state: absent
      tags: delete

    # Instances started by earlier Galvanize versions have other project
    # names (legacy_compose_projects, those that differ): remove such
    # leftovers too. A no-op when there are none, and never fails the run.
    - name: Remove an instance left under a previous project name
      ansible.builtin.command: "docker compose -p {{ item }} down --remove-orphans"
      loop: "{{ legacy_compose_projects | default([]) }}"
      changed_when: false
      failed_when: false
      tags:
        - delete
