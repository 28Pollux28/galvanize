---
- hosts: all
  gather_facts: false
  tasks:
    - name: Build base service definition
      ansible.builtin.set_fact:
        _tcp_service:
          image: "{{ image }}"
          environment: "{{ env | default({}) }}"
          network_mode: bridge
          ports: "{{ published_ports }}"
          restart: unless-stopped
      tags:
        - create
        - delete

    - name: Apply resource limits to service
      ansible.builtin.set_fact:
        _tcp_service: "{{ _tcp_service | combine(resource_overrides, recursive=True) }}"
      when: resource_overrides is defined and resource_overrides | length > 0
      tags:
        - create
        - delete

    - name: Build compose definition
      ansible.builtin.set_fact:
        compose_definition:
          services:
            tcp: "{{ _tcp_service }}"
      tags:
        - create
        - delete

    - name: Déploiement du docker-compose
      community.docker.docker_compose_v2:
        definition: "{{ compose_definition }}"
        project_name: "{{ compose_project }}"
        pull: missing
      tags: create

    - name: Arrêt et suppression du docker-compose
      community.docker.docker_compose_v2:
        definition: "{{ compose_definition }}"
        project_name: "{{ compose_project }}"
        state: absent
      tags: delete

    # Instances started by Galvanize v0.7.1 or earlier have another project
    # name (legacy_compose_project, set when it differs): remove such a
    # leftover too. A no-op when there is none, and never fails the run.
    - name: Remove an instance left under its previous project name
      ansible.builtin.command: "docker compose -p {{ legacy_compose_project }} down --remove-orphans"
      when: legacy_compose_project is defined
      changed_when: false
      failed_when: false
      tags:
        - delete
