---
# Internal playbook of Galvanize (embedded in the binary): checks or removes
# challenge images on every host. The shell script is Galvanize's; image
# names are passed as separate arguments, never inside the script.
# GALVANIZE_RUN_ID marks the processes of the run (see the stop playbook).
- hosts: all
  gather_facts: false
  environment:
    GALVANIZE_RUN_ID: "{{ galvanize_run_id }}"
  tasks:
    - name: Images
      ansible.builtin.command:
        argv: "{{ ['sh', '-c', images_script, 'sh'] + images }}"
      changed_when: false
