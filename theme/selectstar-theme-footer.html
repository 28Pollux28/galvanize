<!-- ===================================================================
     SelectStar Industries — paste this into:
     Admin → Config → Theme → "Theme Footer" box
     (injected before </body>; colours each challenge tile by its point
     value, since the stock core template doesn't expose the value as a
     CSS hook. Tiers: <3 blue · 3-4 green · 5-6 yellow · 7-9 red · >=10 black)
     =================================================================== -->
<script>
(function(){
  function tier(v){
    if(v<3)  return 'tier-blue';
    if(v<5)  return 'tier-green';   // 3-4
    if(v<7)  return 'tier-yellow';  // 5-6
    if(v<10) return 'tier-red';     // 7-9
    return 'tier-black';            // 10+
  }
  var TIERS=['tier-blue','tier-green','tier-yellow','tier-red','tier-black'];
  function tag(){
    document.querySelectorAll('.challenge-button').forEach(function(b){
      var span=b.querySelector('.challenge-inner span');
      if(!span) return;
      var v=parseInt(span.textContent,10);
      if(isNaN(v)) return;
      TIERS.forEach(function(c){b.classList.remove(c);});
      b.classList.add(tier(v));
    });
  }
  // Challenge board renders async (Alpine), so re-tag on DOM changes.
  // ponytail: observes full body subtree — fine for a challenge page, scope it if a page ever gets huge.
  new MutationObserver(tag).observe(document.documentElement,{childList:true,subtree:true});
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',tag); else tag();
})();
</script>
