<!-- ===================================================================
     SelectStar Industries — paste this into:
     Admin → Config → Theme → "Theme Header" box
     (injected before </head> on every public page; works on the stock
     `core` theme, no theme fork needed)

     /!\ ZYNC/GALVANIZE RESERVED — do NOT restyle these globally or the
     instancer UI in the challenge modal breaks:
       #challenge-window, .btn (btn-dark/-danger/-outline-primary),
       .fa/fa-*, .me-1, [data-bs-theme], #zync_deploy_*
     Tile styling is scoped to `.challenge-button` on purpose (NOT `.btn`).
     =================================================================== -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&display=swap">
<style>
:root{
  --ss-ink:#e8e6df; --ss-line:#33353f; --ss-accent:#b74cff; --ss-accent-2:#3ad0c8;
  /* point tiers — greyed ("grise") hues: surface + lighter stud */
  --tier-blue:#566573;  --tier-blue-top:#74869a;
  --tier-green:#566b57;  --tier-green-top:#74917a;
  --tier-yellow:#897f52; --tier-yellow-top:#b3a86e;
  --tier-red:#7a5656;    --tier-red-top:#a07474;
  --tier-black:#26262b;  --tier-black-top:#45454e;
}

/* ---- page shell ---- */
body{
  color:var(--ss-ink);
  font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  background-color:#0c0d10;
  background-image:
    linear-gradient(135deg,rgba(183,76,255,.06),transparent 40%),
    linear-gradient(315deg,rgba(58,208,200,.06),transparent 40%),
    repeating-linear-gradient(60deg,rgba(255,255,255,.015) 0 2px,transparent 2px 22px),
    repeating-linear-gradient(-60deg,rgba(255,255,255,.015) 0 2px,transparent 2px 22px);
  background-attachment:fixed;
}

/* ---- navbar ---- */
.navbar.bg-dark{
  background:rgba(12,13,16,.92)!important;
  border-bottom:1px solid var(--ss-line);
}

/* ---- hero / jumbotron ---- */
.jumbotron{
  background:linear-gradient(135deg,rgba(23,18,32,.95),rgba(12,13,16,.95))!important;
  border:1px solid var(--ss-line); border-radius:0;
  box-shadow:inset 0 0 0 4px #000,0 0 0 1px var(--ss-accent);
}
.jumbotron h1{
  text-transform:uppercase; letter-spacing:.12em; font-weight:800;
  text-shadow:2px 2px 0 var(--ss-accent);
}
.jumbotron .container::after{
  content:"SELECTSTAR INDUSTRIES // AUTHORIZED PERSONNEL ONLY";
  display:block; margin-top:.5rem;
  font-size:.62rem; letter-spacing:.3em; color:var(--ss-accent-2); opacity:.8;
}

/* ---- category headers ---- */
.category-header h3{
  text-transform:uppercase; letter-spacing:.1em; font-weight:700;
  border-left:4px solid var(--ss-accent); padding-left:.6rem;
}

/* ---- challenge tiles: lego brick, coloured by points (see footer JS) ---- */
.challenge-button{
  --brick:#333; --brick-top:#555;
  background:var(--brick)!important;
  border:2px solid rgba(0,0,0,.55)!important; border-radius:6px!important;
  color:#f4f2ec!important; position:relative; padding-top:1.1rem!important;
  box-shadow:inset 0 -6px 0 rgba(0,0,0,.28),inset 0 2px 0 rgba(255,255,255,.12),0 3px 0 rgba(0,0,0,.5);
  transition:transform .08s ease,box-shadow .08s ease,filter .08s ease;
  text-shadow:0 1px 1px rgba(0,0,0,.6);
}
.challenge-button::before{ /* lego studs */
  content:""; position:absolute; top:-7px; left:14px; right:14px; height:10px;
  background-image:radial-gradient(circle at 10px 50%,var(--brick-top) 0 6px,transparent 7px);
  background-size:28px 10px; background-repeat:repeat-x; opacity:.9;
}
.challenge-button:hover{
  transform:translateY(-2px); filter:brightness(1.08);
  box-shadow:inset 0 -6px 0 rgba(0,0,0,.28),inset 0 2px 0 rgba(255,255,255,.12),0 6px 0 rgba(0,0,0,.5),0 0 0 2px var(--ss-accent);
}
.challenge-button .challenge-inner p{
  font-weight:700; text-transform:uppercase; letter-spacing:.03em; margin-bottom:.35rem;
}
.challenge-button .challenge-inner span{
  display:inline-block; font-weight:700; font-size:1.1rem;
  padding:.05rem .5rem; border-radius:3px; background:rgba(0,0,0,.3);
}
.challenge-button.tier-blue  {--brick:var(--tier-blue);  --brick-top:var(--tier-blue-top);}
.challenge-button.tier-green {--brick:var(--tier-green); --brick-top:var(--tier-green-top);}
.challenge-button.tier-yellow{--brick:var(--tier-yellow);--brick-top:var(--tier-yellow-top);}
.challenge-button.tier-red   {--brick:var(--tier-red);   --brick-top:var(--tier-red-top);}
.challenge-button.tier-black {--brick:var(--tier-black); --brick-top:var(--tier-black-top);}
.challenge-button.challenge-solved{filter:grayscale(.4) brightness(.8);}
.challenge-button.challenge-solved::after{
  content:"\2713 CLEARED"; position:absolute; top:6px; right:8px;
  font-size:.55rem; letter-spacing:.15em; color:var(--ss-accent-2);
}

/* ---- cards / modals ---- */
.modal-content,.card{background:#16171c!important; border:1px solid var(--ss-line)!important; color:var(--ss-ink);}

/* ---- form controls (inputs, selects, search) — kill the grey ---- */
.form-control,.form-select,.custom-select,.input-group-text,
input,textarea,select{
  background-color:#16171c!important; color:var(--ss-ink)!important;
  border:1px solid var(--ss-line)!important;
}
.form-control::placeholder{color:#7d808c!important;}
.form-control:focus,.form-select:focus,.custom-select:focus,
input:focus,textarea:focus,select:focus{
  background-color:#1d1f26!important; color:var(--ss-ink)!important;
  border-color:var(--ss-accent)!important;
  box-shadow:0 0 0 .18rem rgba(183,76,255,.25)!important;
}
.form-select,.custom-select{ /* keep the dropdown arrow visible on dark */
  background-image:url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' fill='%23b0b3bf'%3e%3cpath d='M8 11 3 6h10z'/%3e%3c/svg%3e")!important;
  background-repeat:no-repeat!important; background-position:right .6rem center!important;
  background-size:12px!important;
}

/* ---- tables — dark rows, accent header ---- */
.table{color:var(--ss-ink)!important; border-color:#2a2c34!important;}
.table thead th{
  background-color:#1d1f26!important; color:var(--ss-ink)!important;
  border-bottom:2px solid var(--ss-accent)!important; border-color:#2a2c34!important;
  text-transform:uppercase; letter-spacing:.06em; font-size:.82rem;
}
.table td,.table th{background-color:#141519!important; border-color:#2a2c34!important;}
.table-striped tbody tr:nth-of-type(odd) td{background-color:#17181e!important;}
.table-hover tbody tr:hover td{background-color:rgba(183,76,255,.10)!important;}
</style>
