<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UnitedCTF — Classement par école</title>
  <style>
    :root {
      --bg: #07090f;
      --panel: #101522;
      --panel-2: #161c2c;
      --line: #2a3348;
      --text: #e8edf7;
      --muted: #93a0b8;
      --accent: #7dd3fc;
      --gold: #f5c16c;
      --silver: #c9d4e5;
      --bronze: #d4925a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", sans-serif;
      background:
        radial-gradient(1200px 500px at 10% -10%, #16324d 0%, transparent 50%),
        radial-gradient(900px 400px at 110% 0%, #3b2a12 0%, transparent 46%),
        var(--bg);
      color: var(--text);
    }
    main { max-width: 980px; margin: 0 auto; padding: 32px 18px 64px; }
    header { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
    .kicker { color: var(--accent); letter-spacing: .14em; text-transform: uppercase; font-size: 12px; margin: 0 0 8px; }
    h1 { margin: 0 0 8px; font-size: clamp(28px, 5vw, 42px); }
    .sub { color: var(--muted); margin: 0; max-width: 62ch; line-height: 1.45; }
    .actions { display: flex; gap: 8px; align-items: center; }
    button, .link {
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      border-radius: 999px;
      padding: 8px 14px;
      cursor: pointer;
      text-decoration: none;
      font-size: 14px;
    }
    button.active { border-color: var(--accent); color: var(--accent); }
    .meta { display: flex; gap: 16px; flex-wrap: wrap; color: var(--muted); font-size: 13px; margin: 18px 0; }
    .schools { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 18px; }
    table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
    th, td { padding: 12px 14px; text-align: left; }
    th { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; background: var(--panel-2); }
    tr + tr td { border-top: 1px solid var(--line); }
    .rank { width: 52px; font-weight: 700; }
    .r1 { color: var(--gold); }
    .r2 { color: var(--silver); }
    .r3 { color: var(--bronze); }
    .num { font-variant-numeric: tabular-nums; }
    .empty { color: var(--muted); padding: 28px 8px; }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <p class="kicker" data-i18n="kicker">UnitedCTF 2026</p>
        <h1 data-i18n="title">Classement par école</h1>
        <p class="sub" data-i18n="sub">Même classement que CTFd, limité aux joueurs d’une école. Les variantes d’affiliation (UDES / JDIS, ÉTS / DCI, Polytechnique, …) sont regroupées.</p>
      </div>
      <div class="actions">
        <button id="btn-fr" class="active" type="button">FR</button>
        <button id="btn-en" type="button">EN</button>
        <a class="link" href="https://ctf.unitedctf.ca/">CTFd</a>
      </div>
    </header>
    <div class="meta">
      <span id="updated"></span>
      <span id="counts"></span>
    </div>
    <div class="schools" id="schools"></div>
    <table>
      <thead>
        <tr>
          <th class="rank">#</th>
          <th data-i18n="th_player">Joueur</th>
          <th class="num" data-i18n="th_score">Points</th>
          <th class="num" data-i18n="th_solves">Solves</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <p class="empty" id="empty" hidden></p>
  </main>
  <script>
    const i18n = {
      fr: {
        title: "Classement par école",
        kicker: "UnitedCTF 2026",
        sub: "Même classement que CTFd, limité aux joueurs d’une école. Les variantes d’affiliation (UDES / JDIS, ÉTS / DCI, Polytechnique, …) sont regroupées.",
        th_player: "Joueur",
        th_score: "Points",
        th_solves: "Solves",
        updated: "Mis à jour",
        players: "joueurs",
        empty: "Aucune affiliation pour l’instant."
      },
      en: {
        title: "Scoreboard by school",
        kicker: "UnitedCTF 2026",
        sub: "The same scoreboard as CTFd, limited to players from one school. Affiliation variants (UDES / JDIS, ÉTS / DCI, Polytechnique, …) are grouped.",
        th_player: "Player",
        th_score: "Points",
        th_solves: "Solves",
        updated: "Updated",
        players: "players",
        empty: "No affiliations yet."
      }
    };
    let lang = localStorage.getItem("schools-lang") || "fr";
    let selected = decodeURIComponent((location.hash || "").replace(/^#/, ""));
    let data = null;

    function t(key) { return i18n[lang][key]; }
    function applyLang() {
      document.documentElement.lang = lang;
      document.title = "UnitedCTF — " + t("title");
      document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = t(el.dataset.i18n));
      document.getElementById("btn-fr").classList.toggle("active", lang === "fr");
      document.getElementById("btn-en").classList.toggle("active", lang === "en");
    }
    function rankClass(rank) { return rank === 1 ? "r1" : rank === 2 ? "r2" : rank === 3 ? "r3" : ""; }

    function currentSchool() {
      return data.schools.find(s => s.school === selected) || data.schools[0] || null;
    }

    function render() {
      applyLang();
      if (!data) return;
      document.getElementById("updated").textContent = t("updated") + " " + data.generated_at;
      const school = currentSchool();
      if (school) selected = school.school;
      const tabs = document.getElementById("schools");
      tabs.innerHTML = "";
      data.schools.forEach(s => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = s.school + " (" + s.player_count + ")";
        btn.classList.toggle("active", s.school === selected);
        btn.onclick = () => {
          selected = s.school;
          location.hash = encodeURIComponent(selected);
          render();
        };
        tabs.appendChild(btn);
      });
      const tbody = document.getElementById("rows");
      tbody.innerHTML = "";
      document.getElementById("empty").hidden = Boolean(school);
      document.getElementById("empty").textContent = t("empty");
      if (!school) {
        document.getElementById("counts").textContent = "";
        return;
      }
      document.getElementById("counts").textContent = school.player_count + " " + t("players");
      school.players.forEach(p => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td class="rank ${rankClass(p.rank)}">${p.rank}</td>
          <td>${p.name}</td>
          <td class="num">${p.score}</td>
          <td class="num">${p.solves}</td>`;
        tbody.appendChild(tr);
      });
    }

    async function refresh() {
      const res = await fetch("/api/scoreboard", { cache: "no-store" });
      data = await res.json();
      render();
    }
    document.getElementById("btn-fr").onclick = () => { lang = "fr"; localStorage.setItem("schools-lang", lang); render(); };
    document.getElementById("btn-en").onclick = () => { lang = "en"; localStorage.setItem("schools-lang", lang); render(); };
    window.addEventListener("hashchange", () => {
      selected = decodeURIComponent((location.hash || "").replace(/^#/, ""));
      render();
    });
    refresh();
    setInterval(refresh, 15000);
  </script>
</body>
</html>
